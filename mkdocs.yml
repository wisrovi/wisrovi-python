site_name: "🐍 Programa Integral de Formación en Python"
site_description: "De Cero a Agentes de Inteligencia Artificial - 32 Semanas por Wisrovi Rodríguez"
site_author: "William Rodríguez (Wisrovi)"
site_url: "https://wisrovi.github.io/wisrovi-python/"
repo_url: "https://github.com/wisrovi/wisrovi-python"
repo_name: "wisrovi/wisrovi-python"

exclude_docs: |
  README.md
  **/README.md

theme:
  name: material
  language: es
  palette:
    - scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Modo Oscuro
    - scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Modo Claro
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.instant
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html

